name: Verify Galaxy tool

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'planemo==0.75.48' 'galaxy-tool-util==26.1.2' 'edam-ontology==1.25.3'
      - name: Check XML with Galaxy
        run: python tests/lint_tool.py
      - name: Run synthetic end-to-end test
        run: python -m unittest tests.test_runner -v
      - name: Run Galaxy XML test
        run: planemo test --install_galaxy --no_dependency_resolution --no_conda_auto_init fmri_reproducibility.xml
