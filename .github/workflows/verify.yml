name: Verify Galaxy tool

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'planemo==0.75.48' 'galaxy-tool-util==26.1.2' 'edam-ontology==1.25.3'
      - name: Check XML with Galaxy
        run: python tests/lint_tool.py
      - name: Run synthetic end-to-end test
        run: python -m unittest tests.test_runner -v
      - name: Run Galaxy XML test
        run: |
          set +e
          CONDA_OVERRIDE_CUDA='' planemo test --install_galaxy --conda_dependency_resolution --conda_auto_install --conda_auto_init --conda_channels conda-forge,bioconda --test_output_text planemo_results.txt fmri_reproducibility.xml 2>&1 | tee planemo.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          report = Path("planemo_results.txt")
          details = report.read_text(errors="replace") if report.exists() else "\n".join(Path("planemo.log").read_text(errors="replace").splitlines()[-20:])
          escaped = details[-3500:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Planemo failure details::{escaped}")
          PY
            exit "$result"
          fi
